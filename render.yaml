services:
  # Frontend Web Application (AtlasBridge)
  - type: web
    name: lampad-atlasbridge
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    # Header rules need a `path`; `name`/`value` are the header itself.
    headers:
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: require-corp

  # Backend Webhook Mapping
  - type: web
    name: lampad-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
